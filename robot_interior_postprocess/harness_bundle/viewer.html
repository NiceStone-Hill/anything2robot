<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>平滑线束与电机线路</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10222c;color:#e0edf2;font:16px/1.6 system-ui}article{max-width:1500px;margin:auto;padding:24px}h1{margin-bottom:8px}a{color:#7ed4e3}nav,.controls{display:flex;gap:18px;flex-wrap:wrap;margin:16px 0}.note{background:#263942;border-left:4px solid #f3b85b;padding:14px}canvas{width:100%;height:680px;touch-action:none;border:1px solid #36515d}button,select{background:#263942;color:white;padding:7px;border:1px solid #46616c;border-radius:4px}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px;border-bottom:1px solid #36515d;text-align:left}.scroll{overflow:auto}.stats{font-size:20px;color:#f3b85b}#detail{min-height:45px;color:#a6ced8}small{color:#a6c0ca}.legend{display:flex;gap:6px;flex-wrap:wrap}.legend button{font-size:12px;text-align:left}.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.legend .active{outline:2px solid white}#functions{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0}</style>
<article><h1>平滑线束 · 电机线路可追踪</h1>__SUMMARY__
<div class="controls"><label><input id="shell" type="checkbox" checked> 外壳轮廓</label><label><input id="modules" type="checkbox" checked> 真实器件模型</label><label><input id="proxies" type="checkbox"> 未选型部件预留框</label><label><input id="motors" type="checkbox" checked> 电机位置</label><label><input id="gaps" type="checkbox" checked> 未接通参考段</label><label><input id="labels" type="checkbox"> 其他模块名称</label></div>
<div class="controls"><label>范围 <select id="scope"><option value="all">全部线路</option><option value="motors">仅电机线路</option></select></label><label>颜色 <select id="mode"><option value="cable">每根线独立颜色</option><option value="function">按功能分色</option><option value="sleeve">线束外包</option></select></label><select id="cable"><option value="">全部显示</option></select><button id="front">前视</button><button id="side">侧视</button><button id="reset">取消单线高亮</button></div>
<div id="functions"></div><canvas id="view"></canvas><p id="detail"></p>
<p><small>彩色分带用于显示线束成员，不代表束内每根线的实际位置；白色虚线只是集中出口与电机包络之间的距离参考，不是已规划或已验证的接头线。拖动旋转，滚轮缩放。</small></p><div class="legend" id="legend"></div>
<h2>电机接线核对</h2><div class="scroll">__MOTOR_TABLE__</div>
<h2>共享线束段</h2><p>表中的圆角半径来自几何路径，平滑后重新检查装配碰撞和非连接处分支重叠。分叉处单根线的展开仍待设计。</p><div class="scroll">__SEGMENT_TABLE__</div></article>
<script>
const data=__DATA__,canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),shell=$('shell'),modules=$('modules'),proxies=$('proxies'),motors=$('motors'),gaps=$('gaps'),labels=$('labels'),cable=$('cable'),scope=$('scope'),mode=$('mode');
const byCable=Object.fromEntries(data.cables.map(c=>[c.id,c]));let yaw=.15,pitch=-.08,zoom=1,down=null;
const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(const s of data.shells)for(const p of s.vertices)for(let i=0;i<3;i++){lo[i]=Math.min(lo[i],p[i]);hi[i]=Math.max(hi[i],p[i])}const center=lo.map((a,i)=>(a+hi[i])/2),span=Math.max(...hi.map((a,i)=>a-lo[i]));
for(const m of data.motors){const o=document.createElement('option');o.value=m.device;o.textContent=m.motor_id+' / '+m.device;scope.append(o)}
for(const c of data.cables){const o=document.createElement('option');o.value=c.id;o.textContent=c.id+' · '+c.source_device+' → '+c.target_device;cable.append(o)}
for(const [key,c] of Object.entries(data.categories)){const p=document.createElement('span'),s=document.createElement('span');s.className='swatch';s.style.background=c.color;p.append(s,document.createTextNode(c.label));$('functions').append(p)}
function visibleCables(){let records=data.cables;if(scope.value==='motors'){const ids=new Set(data.motors.flatMap(m=>m.expected_cables));records=records.filter(c=>ids.has(c.id))}else if(scope.value!=='all'){const m=data.motors.find(m=>m.device===scope.value);records=records.filter(c=>m.expected_cables.includes(c.id))}return records}
function color(id){const c=byCable[id];return mode.value==='function'?data.categories[c.category].color:c.color}
function project(p){const [x,y,z]=p.map((a,i)=>a-center[i]),u=Math.cos(yaw)*x-Math.sin(yaw)*y,v=Math.sin(yaw)*x+Math.cos(yaw)*y;return [u,Math.cos(pitch)*z-Math.sin(pitch)*v,Math.sin(pitch)*z+Math.cos(pitch)*v]}
function stroke(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](...p));ctx.stroke()}
function draw(){const dpr=devicePixelRatio||1;canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;const w=canvas.width,h=canvas.height,scale=Math.min(w,h)*.88/span*zoom;ctx.fillStyle='#10222c';ctx.fillRect(0,0,w,h);const xy=p=>{const q=project(p);return [w/2+q[0]*scale,h/2-q[1]*scale]};
const selected=byCable[cable.value],available=new Set(visibleCables().map(c=>c.id));
function mesh(s,strokeColor,fill){const pts=s.vertices.map(xy);ctx.strokeStyle=strokeColor;ctx.lineWidth=.6*dpr;ctx.fillStyle=fill||'transparent';for(const f of s.faces){ctx.beginPath();f.forEach((v,i)=>ctx[i?'lineTo':'moveTo'](...pts[v]));ctx.closePath();if(fill)ctx.fill();ctx.stroke()}}
if(shell.checked)for(const s of data.shells)mesh(s,'#34505c66');
if(proxies.checked)for(const m of data.missing_models){const [a,b]=m.bounds_mm;const vertices=[];for(let i=0;i<8;i++)vertices.push([i&1?b[0]:a[0],i&2?b[1]:a[1],i&4?b[2]:a[2]]);mesh({vertices,faces:[[0,1,3,2],[4,5,7,6],[0,1,5,4],[2,3,7,6],[0,2,6,4],[1,3,7,5]]},'#8194a8','#637b8920')}
const cadTriangles=[];
function addCAD(model){const m=model.mesh,q=m.vertices.map(project),points=q.map(p=>[w/2+p[0]*scale,h/2-p[1]*scale]);for(let i=0;i<m.faces.length;i++){const f=m.faces[i],rgb=m.face_colors?m.face_colors[i]:[130,145,158],a=q[f[0]],b=q[f[1]],c=q[f[2]],u=b.map((v,j)=>v-a[j]),v=c.map((n,j)=>n-a[j]),normal=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]],shade=.4+.6*Math.abs((normal[0]*.25+normal[1]*.35+normal[2]*.9)/(Math.hypot(...normal)||1));cadTriangles.push({points:f.map(index=>points[index]),depth:f.reduce((sum,index)=>sum+q[index][2],0),color:'rgb('+rgb.map(value=>Math.round(Math.min(255,value*shade))).join(',')+')'})}}
if(modules.checked)for(const model of data.actual_models)addCAD(model);
if(motors.checked)for(const motor of data.motors)addCAD(motor);
cadTriangles.sort((a,b)=>a.depth-b.depth);for(const face of cadTriangles){ctx.beginPath();face.points.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](...p));ctx.closePath();ctx.fillStyle=face.color;ctx.fill()}

const segments=[...data.segments].sort((a,b)=>project(a.points_mm[0])[2]-project(b.points_mm[0])[2]);
for(const s of segments){const points=s.points_mm.map(xy),width=Math.max(3*dpr,s.diameter_mm*scale);stroke(points,'#29434d',width);let members=s.cables.filter(id=>available.has(id));if(selected)members=members.filter(id=>id===selected.id);if(!members.length)continue;
if(mode.value==='sleeve'){stroke(points,selected?selected.color:'#f3b85b',width);continue}
if(mode.value==='function'){const seen=new Set();members=members.filter(id=>{const k=byCable[id].category;if(seen.has(k))return false;seen.add(k);return true})}members.forEach((id,i)=>stroke(points,color(id),selected?Math.max(3*dpr,width*.55):Math.max(.7*dpr,width*(members.length-i)/members.length)))}
ctx.font=(12*dpr)+'px system-ui';const labelBoxes=[];
for(const m of data.motors){if(scope.value!=='all'&&scope.value!=='motors'&&scope.value!==m.device)continue;if(selected&&!m.expected_cables.includes(selected.id))continue;const p=m.aggregation_exit_mm,q=m.envelope_reference_mm;if(!p||!q)continue;if(gaps.checked){ctx.setLineDash([5*dpr,4*dpr]);stroke([xy(p),xy(q)],'#f5f4dc',1.5*dpr);ctx.setLineDash([])}if(motors.checked){const [x,y]=xy(m.mechanical_envelope.center_mm);let tx=x+8*dpr,ty=y-12*dpr;for(let k=0;k<labelBoxes.length+1;k++){const hit=labelBoxes.find(r=>tx<r[0]+210*dpr&&tx+210*dpr>r[0]&&ty<r[1]+36*dpr&&ty+36*dpr>r[1]);if(!hit)break;ty=hit[1]+40*dpr}labelBoxes.push([tx,ty]);stroke([[x,y],[tx,ty]],'#9fb6c0',dpr);ctx.fillStyle='#eff7fa';ctx.fillText(m.motor_id,tx,ty);ctx.fillStyle='#ffe0a0';ctx.fillText('接头段待设计 '+m.unresolved_gap_distance_mm.toFixed(1)+' mm',tx,ty+16*dpr)}}
for(const [name,p] of Object.entries(data.ports)){const [x,y]=xy(p.position_mm);ctx.fillStyle='#f6f7ed';ctx.beginPath();ctx.arc(x,y,2.5*dpr,0,Math.PI*2);ctx.fill();if(labels.checked){ctx.fillStyle='#eff7fa';ctx.fillText(name,x+6*dpr,y-6*dpr)}}
$('detail').textContent=selected?selected.id+'：'+selected.source_device+' → '+selected.target_device+'；'+data.categories[selected.category].label+'；经过 '+selected.segments.map(s=>s.segment_id).join(' → ')+'。两端真实接头仍待设计。':'当前显示 '+available.size+' 条独立线路。点击下面的颜色标签可单独追踪；“仅电机线路”显示电机供电、回线和通信。';
}
function legend(){const el=$('legend');el.replaceChildren();for(const c of visibleCables()){const b=document.createElement('button'),s=document.createElement('span');s.className='swatch';s.style.background=color(c.id);b.append(s,document.createTextNode(c.id));b.className=cable.value===c.id?'active':'';b.title=c.source_device+' → '+c.target_device;b.onclick=()=>{cable.value=cable.value===c.id?'':c.id;legend();draw()};el.append(b)}}
for(const e of [shell,modules,proxies,motors,gaps,labels])e.onchange=draw;
cable.onchange=()=>{if(cable.value&&!visibleCables().some(c=>c.id===cable.value))scope.value='all';legend();draw()};
scope.onchange=()=>{cable.value='';legend();draw()};mode.onchange=()=>{legend();draw()};
$('front').onclick=()=>{yaw=0;pitch=0;draw()};$('side').onclick=()=>{yaw=Math.PI/2;pitch=0;draw()};$('reset').onclick=()=>{cable.value='';legend();draw()};
for(const b of document.querySelectorAll('[data-motor]'))b.onclick=()=>{scope.value=b.dataset.motor;cable.value='';legend();draw();canvas.scrollIntoView({behavior:'smooth',block:'center'})};
canvas.onpointerdown=e=>{down=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>down=null;canvas.onpointercancel=()=>down=null;canvas.onpointermove=e=>{if(down){yaw+=(e.clientX-down[0])*.008;pitch+=(e.clientY-down[1])*.008;down=[e.clientX,e.clientY];draw()}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(8,zoom*(e.deltaY<0?1.1:.9)));draw()};window.onresize=draw;legend();draw();
</script></html>
